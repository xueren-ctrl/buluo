<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <meta name="theme-color" content="#F5EFE0"/>
  <style>
    body{margin:0;background:#F5EFE0;display:flex;align-items:center;justify-content:center;height:100vh;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans SC",sans-serif;color:#2D2410}
    .wrap{display:flex;flex-direction:column;align-items:center;gap:14px}
    .icon{width:84px;height:84px;border-radius:20px;box-shadow:0 2px 4px rgba(107,88,54,.14),0 14px 32px -12px rgba(107,88,54,.45);animation:pop .45s cubic-bezier(.34,1.56,.64,1) both}
    @keyframes pop{from{opacity:0;transform:scale(.8)}to{opacity:1;transform:scale(1)}}
    .title{font-size:19px;font-weight:800;letter-spacing:.04em}
    .sub{font-size:12px;color:#8C7A5A;letter-spacing:.08em}
    .bar{width:120px;height:4px;border-radius:999px;background:#EDE3CC;overflow:hidden}
    .bar i{display:block;height:100%;width:40%;border-radius:999px;background:linear-gradient(90deg,#B8985A,#8B6914);animation:slide 1.1s ease-in-out infinite}
    @keyframes slide{0%{transform:translateX(-110%)}100%{transform:translateX(320%)}}
  </style>
</head>
<body>
  <div class="wrap">
    <img class="icon" src="/icons/icon-192.png" alt=""/>
    <div class="title">部落小助手</div>
    <div class="sub">升级规划 · 本地提醒</div>
    <div class="bar"><i></i></div>
  </div>
</body>
</html>
