name: Build Android APK

# 草稿：电脑没了之后，用 GitHub Actions 在云端出 APK。
# 触发方式：仓库 Actions 页手动 Run workflow，填 tag（如 v1.2.6）。
# 不需要 Android Studio、不需要本地电脑。
# 依赖的 Secrets（仓库 Settings → Secrets and variables → Actions 里建）：
#   ANDROID_KEYSTORE_BASE64  新 keystore 的 base64（生成方法见同目录 README）
#   KEYSTORE_PASSWORD        storePassword
#   KEY_ALIAS                一般填 buluo
#   KEY_PASSWORD             keyPassword
# 注意：新 keystore 的签名和旧的 v1.2.5 不一样，老用户必须先卸载旧版再装新版，
# 覆盖安装会报签名不一致。先把备份导入修好（见 README）再发新包。

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag，例如 v1.2.6"
        required: true
        default: "v1.2.6"

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # 注意：仓库装的 Capacitor CLI 要求 Node.js ≥ 22.0.0，
          # 用 20 会在 Capacitor sync 步骤直接报错退出。
          node-version: 22

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          # 与 buluo-test 能跑通的 CI 保持一致，用 JDK 21。
          java-version: 21

      - name: Setup Android SDK
        # 注意：setup-android@v3 默认 packages 是 'tools platform-tools'，
        # 但 'tools' 包早已从 SDK 仓库下架，sdkmanager 会报
        # "Failed to find package 'tools'" 并以 exit code 1 失败。
        # 所以必须显式指定 packages，去掉 tools（platform-tools 已够用，
        # 具体平台和构建工具由下一步单独安装）。
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-36" "build-tools;36.1.0" "platform-tools"

      - name: Build web
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Capacitor sync
        working-directory: frontend
        run: |
          # capacitor.config.ts 在 frontend/，但 android/ 在仓库根目录。
          # 用户电脑上 frontend/android 是指向根 android/ 的 junction（见 .gitignore 注释），
          # 云端全新 checkout 里没有这个 junction，cap sync 会报
          # "android platform has not been added yet"，所以先建符号链接。
          if [ ! -e android ]; then
            ln -s ../android android
          fi
          npx cap sync android

      - name: Restore keystore from secrets
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/buluo.keystore
          cat > android/keystore.properties <<EOF
          storeFile=buluo.keystore
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          EOF

      - name: Link node_modules for Gradle resolution
        working-directory: .
        run: |
          # android/capacitor.settings.gradle 里的路径是 ../node_modules/@capacitor/...，
          # 相对于 android/ 也就是仓库根目录的 node_modules，
          # 但 npm 包实际装在 frontend/node_modules/，建符号链接解决。
          if [ ! -e node_modules ]; then
            ln -s frontend/node_modules node_modules
          fi

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: buluo-${{ inputs.tag }}
          path: android/app/build/outputs/apk/release/app-release.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          name: ${{ inputs.tag }}
          files: android/app/build/outputs/apk/release/app-release.apk
          generate_release_notes: true
